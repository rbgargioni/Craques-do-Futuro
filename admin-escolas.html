<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escolas — Craques do Futuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-allowed-roles="dono">

<header class="simple-topbar">
  <div class="brand">
    <div class="brand-badge">CF</div>
    <div class="brand-text">
      <strong>Craques</strong>
      <span>do Futuro · Administração</span>
    </div>
  </div>
  <div class="simple-topbar-right">
    <div class="profile">
      <div class="avatar">?</div>
      <div class="profile-text">
        <strong>—</strong>
        <span>Dono da conta</span>
      </div>
    </div>
    <a href="#" class="link-sair" data-sair>Sair</a>
  </div>
</header>

<main class="simple-main">

  <!-- SÓCIOS DA CONTA (donos) -->
  <section class="page-header">
    <h2>Sócios da conta</h2>
    <div class="page-header-actions">
      <button class="btn btn-outline" data-toggle-panel="painelSocio">＋ Adicionar sócio</button>
    </div>
  </section>

  <section class="panel is-hidden" id="painelSocio">
    <div class="panel-head">
      <h3>Novo sócio</h3>
    </div>
    <form id="formAdicionarSocio" class="form-grid">
      <div class="field">
        <label for="nomeSocio">Nome</label>
        <input type="text" id="nomeSocio" name="nome" placeholder="Nome do sócio" required>
      </div>
      <div class="field">
        <label for="emailSocio">E-mail</label>
        <input type="email" id="emailSocio" name="email" placeholder="socio@email.com" required>
      </div>
      <div class="field field--full">
        <label for="senhaSocio">Senha provisória</label>
        <input type="text" id="senhaSocio" name="senha" placeholder="Ele pode trocar depois, no primeiro acesso" required minlength="6">
      </div>
      <div class="form-actions field--full">
        <button type="button" class="btn btn-outline" data-toggle-panel="painelSocio">Cancelar</button>
        <button type="submit" class="btn btn-primary">Adicionar sócio</button>
      </div>
    </form>
  </section>

  <ul class="message-list" id="listaSocios" style="margin-bottom:28px;">
    <li class="empty-state">Carregando...</li>
  </ul>

  <section class="page-header">
    <h2>Escolas <span class="tag" id="totalEscolas">carregando...</span></h2>
    <div class="page-header-actions">
      <label class="search-bar">
        <span>🔍</span>
        <input type="text" placeholder="Buscar escola..." data-search="#listaEscolas">
      </label>
      <button class="btn btn-primary" id="btnCadastrarEscola" data-toggle-panel="painelEscola">＋ Cadastrar escola</button>
    </div>
  </section>

  <p id="erroAdmin" class="is-hidden status-note" style="background:var(--bad-bg);color:var(--bad);border-color:#f3c8c4;"></p>

  <!-- PAINEL: NOVA ESCOLA -->
  <section class="panel is-hidden" id="painelEscola">
    <div class="panel-head">
      <h3>Nova escola</h3>
    </div>
    <form id="formCadastrarEscola" class="form-grid">
      <div class="field field--full">
        <label for="nomeEscola">Nome da escola</label>
        <input type="text" id="nomeEscola" name="nome" placeholder="Ex: Escolinha Estrela do Futuro" required>
      </div>
      <div class="field">
        <label for="licencaInicio">Início da licença</label>
        <input type="date" id="licencaInicio" name="licencaInicio" required>
      </div>
      <div class="field">
        <label for="licencaFim">Fim da licença</label>
        <input type="date" id="licencaFim" name="licencaFim" required>
      </div>
      <div class="field">
        <label for="nomeAdminInicial">Nome do administrador</label>
        <input type="text" id="nomeAdminInicial" name="nomeAdmin" placeholder="Ex: Rafael Terra" required>
      </div>
      <div class="field">
        <label for="emailAdminInicial">E-mail do administrador</label>
        <input type="email" id="emailAdminInicial" name="emailAdmin" placeholder="admin@email.com" required>
      </div>
      <div class="field field--full">
        <label for="senhaAdminInicial">Senha provisória do administrador</label>
        <input type="text" id="senhaAdminInicial" name="senhaAdmin" placeholder="Ele pode trocar depois, no primeiro acesso" required minlength="6">
      </div>
      <div class="form-actions field--full">
        <button type="button" class="btn btn-outline" data-toggle-panel="painelEscola">Cancelar</button>
        <button type="submit" class="btn btn-primary">Criar escola</button>
      </div>
    </form>
  </section>

  <!-- PAINEL: EDITAR ESCOLA (aberto ao clicar num card) -->
  <section class="panel is-hidden" id="painelEditarEscola">
    <div class="panel-head">
      <h3 id="tituloEditarEscola">Editar escola</h3>
      <button type="button" class="btn btn-outline btn-sm" data-toggle-panel="painelEditarEscola">Fechar</button>
    </div>
    <form id="formEditarEscola" class="form-grid">
      <div class="field field--full">
        <label for="nomeEditarEscola">Nome da escola</label>
        <input type="text" id="nomeEditarEscola" name="nome" required>
      </div>
      <div class="field">
        <label for="licencaInicioEditar">Início da licença</label>
        <input type="date" id="licencaInicioEditar" name="licencaInicio" required>
      </div>
      <div class="field">
        <label for="licencaFimEditar">Fim da licença</label>
        <input type="date" id="licencaFimEditar" name="licencaFim" required>
      </div>
      <div class="field">
        <label for="statusEditarEscola">Status</label>
        <select id="statusEditarEscola" name="status">
          <option value="ativa">Ativa</option>
          <option value="suspensa">Suspensa</option>
        </select>
      </div>
      <div class="form-actions field--full">
        <button type="submit" class="btn btn-primary">Salvar alterações</button>
      </div>
    </form>

    <div class="panel-head" style="margin-top:22px;">
      <h3>Administradores desta escola</h3>
      <button type="button" class="btn btn-outline btn-sm" data-toggle-panel="painelAdministrador">＋ Adicionar administrador</button>
    </div>
    <ul class="message-list" id="listaAdministradoresEscola">
      <li class="empty-state">Carregando...</li>
    </ul>

    <!-- PAINEL: ADICIONAR ADMINISTRADOR (já vinculado à escola aberta acima) -->
    <section class="panel is-hidden" id="painelAdministrador" style="margin-top:16px; box-shadow:none; border-style:dashed;">
      <div class="panel-head">
        <h3>Novo administrador para <span id="nomeEscolaParaAdmin"></span></h3>
      </div>
      <form id="formAdicionarAdministrador" class="form-grid">
        <input type="hidden" name="escola" id="escolaDoAdminHidden">
        <div class="field">
          <label for="nomeNovoAdmin">Nome</label>
          <input type="text" id="nomeNovoAdmin" name="nome" placeholder="Nome do administrador" required>
        </div>
        <div class="field">
          <label for="emailNovoAdmin">E-mail</label>
          <input type="email" id="emailNovoAdmin" name="email" placeholder="admin@email.com" required>
        </div>
        <div class="field field--full">
          <label for="senhaNovoAdmin">Senha provisória</label>
          <input type="text" id="senhaNovoAdmin" name="senha" placeholder="Ele pode trocar depois, no primeiro acesso" required minlength="6">
        </div>
        <div class="form-actions field--full">
          <button type="button" class="btn btn-outline" data-toggle-panel="painelAdministrador">Cancelar</button>
          <button type="submit" class="btn btn-primary">Adicionar administrador</button>
        </div>
      </form>
    </section>
  </section>

  <!-- GRID DE ESCOLAS (preenchido pelo admin-escolas.js) -->
  <section class="card-grid" id="listaEscolas">
    <p class="empty-state">Carregando escolas...</p>
  </section>

</main>

<script type="module" src="js/auth-guard.js"></script>
<script type="module" src="js/admin-escolas.js"></script>
<script src="js/Script.js"></script>
</body>
</html>
