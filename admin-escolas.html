<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escolas — Craques do Futuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-allowed-roles="dono">

<header class="simple-topbar">
  <div class="brand">
    <div class="brand-badge">CF</div>
    <div class="brand-text">
      <strong>Craques</strong>
      <span>do Futuro · Administração</span>
    </div>
  </div>
  <div class="simple-topbar-right">
    <div class="profile">
      <div class="avatar">?</div>
      <div class="profile-text">
        <strong>—</strong>
        <span>Dono da conta</span>
      </div>
    </div>
    <a href="#" class="link-sair" data-sair>Sair</a>
  </div>
</header>

<main class="simple-main">

  <section class="page-header">
    <h2>Escolas <span class="tag" id="totalEscolas">carregando...</span></h2>
    <div class="page-header-actions">
      <label class="search-bar">
        <span>🔍</span>
        <input type="text" placeholder="Buscar escola..." data-search="#listaEscolas">
      </label>
      <button class="btn btn-outline" data-toggle-panel="painelAdministrador">＋ Adicionar administrador</button>
      <button class="btn btn-primary" data-toggle-panel="painelEscola">＋ Cadastrar escola</button>
    </div>
  </section>

  <p id="erroAdmin" class="is-hidden status-note" style="background:var(--bad-bg);color:var(--bad);border-color:#f3c8c4;"></p>

  <!-- PAINEL: NOVA ESCOLA -->
  <section class="panel is-hidden" id="painelEscola">
    <div class="panel-head">
      <h3>Nova escola</h3>
    </div>
    <form id="formCadastrarEscola" class="form-grid">
      <div class="field field--full">
        <label for="nomeEscola">Nome da escola</label>
        <input type="text" id="nomeEscola" name="nome" placeholder="Ex: Escolinha Estrela do Futuro" required>
      </div>
      <div class="field">
        <label for="licencaInicio">Início da licença</label>
        <input type="date" id="licencaInicio" name="licencaInicio" required>
      </div>
      <div class="field">
        <label for="licencaFim">Fim da licença</label>
        <input type="date" id="licencaFim" name="licencaFim" required>
      </div>
      <div class="field">
        <label for="nomeAdminInicial">Nome do administrador</label>
        <input type="text" id="nomeAdminInicial" name="nomeAdmin" placeholder="Ex: Rafael Terra" required>
      </div>
      <div class="field">
        <label for="emailAdminInicial">E-mail do administrador</label>
        <input type="email" id="emailAdminInicial" name="emailAdmin" placeholder="admin@email.com" required>
      </div>
      <div class="field field--full">
        <label for="senhaAdminInicial">Senha provisória do administrador</label>
        <input type="text" id="senhaAdminInicial" name="senhaAdmin" placeholder="Ele pode trocar depois, no primeiro acesso" required minlength="6">
      </div>
      <div class="form-actions field--full">
        <button type="button" class="btn btn-outline" data-toggle-panel="painelEscola">Cancelar</button>
        <button type="submit" class="btn btn-primary">Criar escola</button>
      </div>
    </form>
  </section>

  <!-- PAINEL: ADICIONAR ADMINISTRADOR A UMA ESCOLA EXISTENTE -->
  <section class="panel is-hidden" id="painelAdministrador">
    <div class="panel-head">
      <h3>Adicionar administrador a uma escola</h3>
    </div>
    <form id="formAdicionarAdministrador" class="form-grid">
      <div class="field field--full">
        <label for="escolaDoAdmin">Escola</label>
        <select id="escolaDoAdmin" name="escola" required>
          <option value="">Carregando escolas...</option>
        </select>
      </div>
      <div class="field">
        <label for="nomeNovoAdmin">Nome</label>
        <input type="text" id="nomeNovoAdmin" name="nome" placeholder="Nome do administrador" required>
      </div>
      <div class="field">
        <label for="emailNovoAdmin">E-mail</label>
        <input type="email" id="emailNovoAdmin" name="email" placeholder="admin@email.com" required>
      </div>
      <div class="field field--full">
        <label for="senhaNovoAdmin">Senha provisória</label>
        <input type="text" id="senhaNovoAdmin" name="senha" placeholder="Ele pode trocar depois, no primeiro acesso" required minlength="6">
      </div>
      <div class="form-actions field--full">
        <button type="button" class="btn btn-outline" data-toggle-panel="painelAdministrador">Cancelar</button>
        <button type="submit" class="btn btn-primary">Adicionar administrador</button>
      </div>
    </form>
  </section>

  <!-- GRID DE ESCOLAS (preenchido pelo admin-escolas.js) -->
  <section class="card-grid" id="listaEscolas">
    <p class="empty-state">Carregando escolas...</p>
  </section>

</main>

<script type="module" src="js/auth-guard.js"></script>
<script type="module" src="js/admin-escolas.js"></script>
<script src="js/Script.js"></script>
</body>
</html>
