<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sem acesso — Craques do Futuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-badge">CF</div>
      <div class="brand-text">
        <strong>Craques</strong>
        <span>do Futuro</span>
      </div>
    </div>

    <div class="empty-state" style="padding:8px 0 20px;">
      <div style="font-size:34px;margin-bottom:10px;">🔒</div>
      <h1 style="font-size:17px;color:var(--text);margin-bottom:8px;">Sem acesso no momento</h1>
      <p style="margin:0;">
        Isso pode acontecer por dois motivos: a licença da sua escola expirou, ou sua conta ainda não tem
        permissão para acessar esta área.
      </p>
    </div>

    <div class="status-note">
      <span>⚠</span>
      <span>Se você é técnico ou responsável, fale com quem administra sua escola para renovar o acesso.</span>
    </div>

    <a href="login.html" class="btn btn-primary" style="display:block;text-align:center;text-decoration:none;">Voltar para o login</a>
  </div>
</div>

<script src="js/Script.js"></script>
</body>
</html>
